name: Build Synthia v0.4.6 Birth Candidate

on:
  push:
    branches:
      - build/v045-birth-candidate
    paths:
      - '.github/synthia-v045/**'
      - '.github/workflows/build-v045-birth-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Synthia birth branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and verify Synthia birth candidate
        shell: bash
        run: |
          chmod +x .github/synthia-v045/build-v046.sh
          .github/synthia-v045/build-v046.sh

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synthia-v0.4.6-BIRTH-CANDIDATE
          path: |
            out/Synthia-Phone-Selfhosted-v0.4.6-BIRTH-CANDIDATE.apk
            out/Synthia-Phone-Selfhosted-v0.4.6-BIRTH-CANDIDATE.apk.sha256
            out/Synthia-Phone-Selfhosted-v0.4.6-BIRTH-CANDIDATE.apk.json
          retention-days: 7
