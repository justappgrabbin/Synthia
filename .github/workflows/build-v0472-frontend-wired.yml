name: Build Synthia v0.4.7.2 Frontend Wired
on:
  push:
    branches:
      - build/v045-birth-candidate
    paths:
      - '.github/front-wiring-v0472/**'
      - '.github/workflows/build-v0472-frontend-wired.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build signed Synthia frontend-wired APK
        shell: bash
        run: |
          sed -i 's|TMP="${RUNNER_TEMP:-/tmp/synthia-v0472-front-wiring}"|TMP="${RUNNER_TEMP:-/tmp}/synthia-v0472-front-wiring"|' .github/front-wiring-v0472/build.sh
          sed -i 's|^"$BASEBUILD"$|RUNNER_TEMP="$TMP/base-runner" "$BASEBUILD"|' .github/front-wiring-v0472/build.sh
          chmod +x .github/front-wiring-v0472/build.sh
          .github/front-wiring-v0472/build.sh
          chmod +x .github/front-wiring-v0472/apply-installed-refresh.sh
          .github/front-wiring-v0472/apply-installed-refresh.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Synthia-v0.4.7.2-FRONTEND-WIRED
          path: |
            out/Synthia-Phone-Selfhosted-v0.4.7.2-FRONTEND-WIRED.apk
            out/Synthia-Phone-Selfhosted-v0.4.7.2-FRONTEND-WIRED.apk.sha256
            out/VERIFICATION.json
          retention-days: 7
