name: Build Synthia v0.4.6 Birth Candidate

on:
  push:
    branches:
      - build/v045-birth-candidate
    paths:
      - '.github/synthia-v045/**'
      - '.github/workflows/build-v046-birth-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRIDGE: https://leisphnjslcuepflefri.supabase.co/functions/v1/synthia-github-build-bridge
      WRAPPER: android-r2116-wrapper
      PATCHDIR: .github/synthia-v045
      OUTBASE: Synthia-Phone-Selfhosted-v0.4.6-BIRTH-CANDIDATE.apk
    steps:
      - name: Checkout Synthia birth branch
        uses: actions/checkout@v4

      - name: Checkout current Synthai2
        uses: actions/checkout@v4
        with:
          repository: justappgrabbin/Synthai2
          ref: main
          path: synthai2-current
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Record source lineage
        shell: bash
        run: |
          set -euo pipefail
          echo "SYNTHAI2_SHA=$(git -C synthai2-current rev-parse HEAD)" >> "$GITHUB_ENV"
          printf '{"synthia_birth":"%s","synthai2":"%s","synthia_server":"%s"}\n' \
            "$GITHUB_SHA" "$(git -C synthai2-current rev-parse HEAD)" "a39bc304387097927f969fd5dd4818822705ed1e" \
            > "$RUNNER_TEMP/source-lineage.json"

      - name: Acquire short-lived build identity
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=synthia-birth-build")"
          token="$(printf '%s' "$response" | jq -r '.value')"
          test -n "$token" && test "$token" != null
          printf '%s' "$token" > "$RUNNER_TEMP/synthia-oidc-token"
          chmod 600 "$RUNNER_TEMP/synthia-oidc-token"

      - name: Retrieve current APK, signing kit, and private phone config
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $(cat "$RUNNER_TEMP/synthia-oidc-token")"
          mkdir -p "$RUNNER_TEMP/synthia-inputs"
          curl -fsS -H "$auth" "$BRIDGE?asset=apk0" -o "$RUNNER_TEMP/synthia-inputs/apk.part-00"
          curl -fsS -H "$auth" "$BRIDGE?asset=apk1" -o "$RUNNER_TEMP/synthia-inputs/apk.part-01"
          curl -fsS -H "$auth" "$BRIDGE?asset=signing" -o "$RUNNER_TEMP/synthia-inputs/signing.zip"
          curl -fsS -H "$auth" "$BRIDGE?asset=phoneconfig" -o "$RUNNER_TEMP/synthia-inputs/phone-sync-config.json"
          cat "$RUNNER_TEMP/synthia-inputs/apk.part-00" "$RUNNER_TEMP/synthia-inputs/apk.part-01" > "$RUNNER_TEMP/current.apk"
          unzip -tq "$RUNNER_TEMP/current.apk" >/dev/null

      - name: Parse signing kit and establish signer identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/signing" && mkdir -p "$RUNNER_TEMP/signing"
          unzip -q "$RUNNER_TEMP/synthia-inputs/signing.zip" -d "$RUNNER_TEMP/signing"
          test -f "$RUNNER_TEMP/signing/synthia-local-sync.jks"
          test -f "$RUNNER_TEMP/signing/SIGNING-KEY-README.txt"
          node <<'NODE' > "$RUNNER_TEMP/signing/parsed.json"
          const fs = require('fs');
          const text = fs.readFileSync(process.env.RUNNER_TEMP + '/signing/SIGNING-KEY-README.txt','utf8');
          const first = patterns => { for (const p of patterns) { const m=text.match(p); if(m) return m[1].trim().replace(/^['\"]|['\"]$/g,''); } return ''; };
          let alias = first([/--ks-key-alias\s+([^\s]+)/i,/\balias\s*[:=]\s*([^\s]+)/i]) || 'synthia';
          let store = first([/--ks-pass\s+pass:([^\s]+)/i,/(?:keystore|store)\s*password\s*[:=]\s*([^\s]+)/i,/\bstorepass\s*[:=]?\s*([^\s]+)/i]);
          let key = first([/--key-pass\s+pass:([^\s]+)/i,/\bkey\s*password\s*[:=]\s*([^\s]+)/i,/\bkeypass\s*[:=]?\s*([^\s]+)/i]);
          if (!store) store = first([/\bpassword\s*[:=]\s*([^\s]+)/i]);
          if (!key) key = store;
          if (!store) process.exit(2);
          fs.writeFileSync(process.env.RUNNER_TEMP + '/signing/parsed.json', JSON.stringify({alias,store,key}));
          NODE
          SIGN_ALIAS="$(jq -r .alias "$RUNNER_TEMP/signing/parsed.json")"
          STORE_PASS="$(jq -r .store "$RUNNER_TEMP/signing/parsed.json")"
          KEY_PASS="$(jq -r .key "$RUNNER_TEMP/signing/parsed.json")"
          test -n "$SIGN_ALIAS" && test -n "$STORE_PASS" && test -n "$KEY_PASS"
          echo "SIGN_ALIAS=$SIGN_ALIAS" >> "$GITHUB_ENV"
          echo "STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          key_cert="$(keytool -list -v -keystore "$RUNNER_TEMP/signing/synthia-local-sync.jks" -alias "$SIGN_ALIAS" -storepass "$STORE_PASS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          test -n "$key_cert"
          echo "KEY_CERT=$key_cert" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/signing/parsed.json"

      - name: Detect Android package identity robustly
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer 2>/dev/null | head -1 || true)"
          test -x "$APKSIGNER" && test -x "$ZIPALIGN"
          app_id=""
          old_code=""
          if test -n "$APKANALYZER" && test -x "$APKANALYZER"; then
            app_id="$($APKANALYZER manifest application-id "$RUNNER_TEMP/current.apk" 2>/dev/null || true)"
            old_code="$($APKANALYZER manifest version-code "$RUNNER_TEMP/current.apk" 2>/dev/null || true)"
          fi
          if { test -z "$app_id" || test -z "$old_code"; } && test -x "$AAPT"; then
            badging="$($AAPT dump badging "$RUNNER_TEMP/current.apk" 2>/dev/null || true)"
            test -n "$app_id" || app_id="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
            test -n "$old_code" || old_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          fi
          if test -z "$app_id" || ! [[ "$old_code" =~ ^[0-9]+$ ]]; then
            echo "Unable to read package/version from the current APK" >&2
            test -x "$AAPT" && "$AAPT" dump badging "$RUNNER_TEMP/current.apk" || true
            exit 1
          fi
          test "$app_id" = "com.synthia.phone"
          new_code="$((old_code + 1))"
          {
            echo "SYNTHIA_APPLICATION_ID=$app_id"
            echo "SYNTHIA_OLD_VERSION_CODE=$old_code"
            echo "SYNTHIA_VERSION_CODE=$new_code"
            echo "SYNTHIA_VERSION_NAME=0.4.6-birth-candidate.1"
            echo "AAPT=$AAPT"
            echo "APKSIGNER=$APKSIGNER"
            echo "ZIPALIGN=$ZIPALIGN"
          } >> "$GITHUB_ENV"
          echo "Android lineage: $app_id versionCode $old_code -> $new_code"

      - name: Build current Synthai2 phone UI
        shell: bash
        working-directory: synthai2-current
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx vite build --base=./
          test -f dist/public/index.html
          test -d dist/public/assets

      - name: Extract current Synthia residence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/residence-extract" "$RUNNER_TEMP/residence"
          mkdir -p "$RUNNER_TEMP/residence-extract"
          unzip -q "$RUNNER_TEMP/current.apk" 'assets/synthia-server/*' -d "$RUNNER_TEMP/residence-extract"
          mv "$RUNNER_TEMP/residence-extract/assets/synthia-server" "$RUNNER_TEMP/residence"
          test -f "$RUNNER_TEMP/residence/server.js"
          test -f "$RUNNER_TEMP/residence/pure-synthia/runtime/daemon.mjs"
          test -f "$RUNNER_TEMP/residence/apps/synthia-sovereign-studio/dist/public/apps/mobile-linux/index.html"

      - name: Preserve and mount Synthai2
        shell: bash
        run: |
          set -euo pipefail
          ui="$RUNNER_TEMP/residence/apps/synthia-sovereign-studio/dist/public/apps/synthai2"
          rm -rf "$ui" && mkdir -p "$ui"
          cp -a synthai2-current/dist/public/. "$ui/"
          src="$RUNNER_TEMP/residence/pure-synthia/donors/current/Synthai2"
          rm -rf "$src" && mkdir -p "$src"
          cp -a synthai2-current/client/src "$src/client-src"
          cp -a synthai2-current/server "$src/server"
          cp -a synthai2-current/shared "$src/shared"
          cp synthai2-current/package.json synthai2-current/vite.config.ts "$src/"
          cp "$RUNNER_TEMP/source-lineage.json" "$src/SOURCE_LINEAGE.json"
          test -f "$ui/index.html"
          test -f "$src/client-src/lib/humanDesignEngine.ts"

      - name: Apply phone runtime, sync, and API repair
        shell: bash
        run: |
          set -euo pipefail
          server="$RUNNER_TEMP/residence/server.js"
          node "$PATCHDIR/patch-server-v2.mjs" "$server" "$PATCHDIR"
          node "$PATCHDIR/patch-embedded-node.mjs" "$server"
          node "$PATCHDIR/patch-portable-js.mjs" "$server"
          cp "$PATCHDIR/synthia-sync-connector.js" "$RUNNER_TEMP/residence/apps/synthia-sovereign-studio/dist/public/apps/mobile-linux/assets/synthia-sync-connector.js"
          mkdir -p "$RUNNER_TEMP/residence/config"
          cp "$RUNNER_TEMP/synthia-inputs/phone-sync-config.json" "$RUNNER_TEMP/residence/config/phone-sync.json"
          node "$PATCHDIR/collect-birth-donors.mjs" "$RUNNER_TEMP/residence"
          node -e "const fs=require('fs');const p='$RUNNER_TEMP/residence/package.json';const j=JSON.parse(fs.readFileSync(p));j.dependencies={...(j.dependencies||{}),'adm-zip':'^0.5.16'};delete j.scripts?.ingest;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          grep -q "artifact.binary_ready" "$server"
          grep -q "startPhoneSync" "$server"
          grep -q "Synthia Phone Residence API" "$server"
          ! grep -q "function pythonInvocation" "$server"
          ! grep -q "spawn('bash'" "$server"
          ! grep -q "execFileSync('git'" "$server"
          node --check "$server"

      - name: Bundle phone production dependencies
        shell: bash
        working-directory: ${{ runner.temp }}/residence
        run: |
          set -euo pipefail
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          test -d node_modules/express
          test -d node_modules/ws
          test -d node_modules/cors
          test -d node_modules/adm-zip

      - name: Run Pure Synthia verification
        shell: bash
        working-directory: ${{ runner.temp }}/residence
        run: |
          set -euo pipefail
          node pure-synthia/tests/full-wiring.node.mjs
          node pure-synthia/tests/durable-restart.node.mjs
          node pure-synthia/tests/current-synthia-swarm.node.mjs
          test -f pure-synthia/donors/recovered/MANIFEST.json
          jq -e '.files | length >= 20' pure-synthia/donors/recovered/MANIFEST.json >/dev/null

      - name: Boot local residence and smoke-test Synthai2 bridge
        shell: bash
        working-directory: ${{ runner.temp }}/residence
        run: |
          set -euo pipefail
          export PORT=6969
          export DATA_DIR="$RUNNER_TEMP/synthia-smoke-data"
          mkdir -p "$DATA_DIR"
          node server.js > "$RUNNER_TEMP/synthia-server.log" 2>&1 &
          pid=$!
          cleanup(){ kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:6969/api/health > "$RUNNER_TEMP/health.json"; then ready=1; break; fi
            sleep 1
          done
          if test "$ready" != 1; then cat "$RUNNER_TEMP/synthia-server.log"; exit 1; fi
          jq -e '.status == "ok" and .local == true and .persistent == true' "$RUNNER_TEMP/health.json" >/dev/null
          curl -fsS http://127.0.0.1:6969/api/mesh/status | jq -e '.status == "online"' >/dev/null
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data '{"path":"birth-test/state.txt","content":"persistent"}' \
            http://127.0.0.1:6969/api/workspace/files | jq -e '.success == true' >/dev/null
          mounted="$(curl -fsS -X POST -H 'Content-Type: application/json' \
            --data '{"name":"birth-smoke","runCommand":"node hello.js","files":[{"path":"hello.js","content":"console.log(\"synthia-local-ok\")"}]}' \
            http://127.0.0.1:6969/api/apps/mount)"
          app_id="$(printf '%s' "$mounted" | jq -r '.app.id')"
          test -n "$app_id" && test "$app_id" != null
          curl -fsS -X POST -H 'Content-Type: application/json' --data '{}' \
            "http://127.0.0.1:6969/api/apps/$app_id/run" | jq -e '.success == true and .run.stdout | contains("synthia-local-ok")' >/dev/null
          curl -fsS http://127.0.0.1:6969/studio/apps/synthai2/ | grep -qi '<html\|<!doctype'
          curl -fsS http://127.0.0.1:6969/mcp/status >/dev/null

      - name: Build canonical residence payload
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/synthia-v046.zip"
          (cd "$RUNNER_TEMP/residence" && zip -q -r "$RUNNER_TEMP/synthia-v046.zip" . -x '*.git/*' '*.DS_Store')
          unzip -tq "$RUNNER_TEMP/synthia-v046.zip" >/dev/null
          payload_sha="$(sha256sum "$RUNNER_TEMP/synthia-v046.zip" | awk '{print $1}')"
          echo "PAYLOAD_SHA=$payload_sha" >> "$GITHUB_ENV"

      - name: Assemble Android embedded-Node wrapper
        shell: bash
        run: |
          set -euo pipefail
          app="$WRAPPER/app"
          mkdir -p "$app/src/main/java/world/synthia/r2116" "$app/src/main/res/drawable" "$app/src/main/assets"
          cp "$PATCHDIR/MainActivity.java" "$app/src/main/java/world/synthia/r2116/MainActivity.java"
          sed -i 's#/studio/apps/mobile-linux/#/studio/apps/synthai2/#' "$app/src/main/java/world/synthia/r2116/MainActivity.java"
          cp "$PATCHDIR/NodeRuntime.java" "$app/src/main/java/world/synthia/r2116/NodeRuntime.java"
          cp "$PATCHDIR/SynthiaRuntimeService.java" "$app/src/main/java/world/synthia/r2116/SynthiaRuntimeService.java"
          sed -i "s/@@PAYLOAD_SHA256@@/$PAYLOAD_SHA/g" "$app/src/main/java/world/synthia/r2116/SynthiaRuntimeService.java"
          cp "$PATCHDIR/native-lib.cpp" "$app/src/main/cpp/native-lib.cpp"
          cp "$PATCHDIR/AndroidManifest.xml" "$app/src/main/AndroidManifest.xml"
          cp "$PATCHDIR/build.gradle" "$app/build.gradle"
          cp "$PATCHDIR/wrapper-launcher.cjs" "$app/src/main/assets/wrapper-launcher.cjs"
          cp "$RUNNER_TEMP/synthia-v046.zip" "$app/src/main/assets/synthia-v045.zip"
          rm -f "$app/src/main/assets/synthia-r21.16.zip"
          if test -f "$RUNNER_TEMP/residence/pure-synthia/extension/icon-512.png"; then
            cp "$RUNNER_TEMP/residence/pure-synthia/extension/icon-512.png" "$app/src/main/res/drawable/synthia_icon.png"
          else
            cp "$RUNNER_TEMP/residence/apps/synthia-sovereign-studio/dist/public/icons/icon-512.png" "$app/src/main/res/drawable/synthia_icon.png"
          fi

      - name: Compile release APK
        shell: bash
        working-directory: android-r2116-wrapper
        env:
          SYNTHIA_APPLICATION_ID: ${{ env.SYNTHIA_APPLICATION_ID }}
          SYNTHIA_VERSION_CODE: ${{ env.SYNTHIA_VERSION_CODE }}
          SYNTHIA_VERSION_NAME: ${{ env.SYNTHIA_VERSION_NAME }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Align, sign, and verify lineage
        shell: bash
        run: |
          set -euo pipefail
          unsigned="$WRAPPER/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/aligned.apk"
          final="$RUNNER_TEMP/$OUTBASE"
          "$ZIPALIGN" -f -p 4 "$unsigned" "$aligned"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/signing/synthia-local-sync.jks" \
            --ks-key-alias "$SIGN_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out "$final" "$aligned"
          "$APKSIGNER" verify --verbose --print-certs "$final" >/dev/null
          new_cert="$($APKSIGNER verify --print-certs "$final" 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')"
          test "$new_cert" = "$KEY_CERT"
          final_badging="$($AAPT dump badging "$final")"
          final_id="$(printf '%s\n' "$final_badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          final_code="$(printf '%s\n' "$final_badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          test "$final_id" = "$SYNTHIA_APPLICATION_ID"
          test "$final_code" = "$SYNTHIA_VERSION_CODE"
          sha256sum "$final" > "$RUNNER_TEMP/$OUTBASE.sha256"
          jq -n \
            --arg artifact "$OUTBASE" \
            --arg application_id "$final_id" \
            --arg old_version_code "$SYNTHIA_OLD_VERSION_CODE" \
            --arg version_code "$final_code" \
            --arg version_name "$SYNTHIA_VERSION_NAME" \
            --arg payload_sha256 "$PAYLOAD_SHA" \
            --arg apk_sha256 "$(sha256sum "$final" | awk '{print $1}')" \
            --arg signer_sha256 "$new_cert" \
            --arg synthai2_sha "$SYNTHAI2_SHA" \
            --arg synthia_server_sha "a39bc304387097927f969fd5dd4818822705ed1e" \
            '{ok:true,artifact:$artifact,application_id:$application_id,old_version_code:$old_version_code,version_code:$version_code,version_name:$version_name,payload_sha256:$payload_sha256,apk_sha256:$apk_sha256,signer_sha256:$signer_sha256,synthai2_sha:$synthai2_sha,synthia_server_sha:$synthia_server_sha,checks:["current Synthai2 built","server lineage recorded","donor preservation","server syntax","Pure Synthia full wiring","durable restart","current swarm","local API boot","workspace persistence","mounted JS execution","Synthai2 UI served","MCP route answered","same package id","same signing key"]}' \
            > "$RUNNER_TEMP/$OUTBASE.json"

      - name: Upload private birth candidate to Synthia release storage
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $(cat "$RUNNER_TEMP/synthia-oidc-token")"
          mkdir -p "$RUNNER_TEMP/chunks"
          split -b 10m -d -a 2 "$RUNNER_TEMP/$OUTBASE" "$RUNNER_TEMP/chunks/$OUTBASE.part-"
          for part in "$RUNNER_TEMP/chunks/$OUTBASE.part-"*; do
            name="$(basename "$part")"
            curl -fsS -X POST -H "$auth" --data-binary @"$part" "$BRIDGE?name=$name" >/dev/null
          done
          curl -fsS -X POST -H "$auth" --data-binary @"$RUNNER_TEMP/$OUTBASE.sha256" "$BRIDGE?name=$OUTBASE.sha256" >/dev/null
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/$OUTBASE.json" "$BRIDGE?name=$OUTBASE.json" >/dev/null

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synthia-v0.4.6-BIRTH-CANDIDATE
          path: |
            ${{ runner.temp }}/Synthia-Phone-Selfhosted-v0.4.6-BIRTH-CANDIDATE.apk
            ${{ runner.temp }}/Synthia-Phone-Selfhosted-v0.4.6-BIRTH-CANDIDATE.apk.sha256
            ${{ runner.temp }}/Synthia-Phone-Selfhosted-v0.4.6-BIRTH-CANDIDATE.apk.json
          retention-days: 7
