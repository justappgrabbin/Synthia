name: Build Synthia v0.4.8 Shell Repair
on:
  push:
    branches:
      - build/v045-birth-candidate
    paths:
      - '.github/shell-repair-v048/**'
      - '.github/workflows/build-v048-shell-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build signed Synthia shell repair APK
        shell: bash
        run: |
          chmod +x .github/shell-repair-v048/build.sh
          .github/shell-repair-v048/build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Synthia-v0.4.8-SHELL-REPAIR
          path: |
            out/Synthia-Phone-Selfhosted-v0.4.8-SHELL-REPAIR.apk
            out/Synthia-Phone-Selfhosted-v0.4.8-SHELL-REPAIR.apk.sha256
            out/VERIFICATION.json
          retention-days: 7
