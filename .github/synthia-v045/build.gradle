plugins { id 'com.android.application' }

import java.net.URL

android {
    namespace 'world.synthia.r2116'
    compileSdk 35

    defaultConfig {
        applicationId System.getenv('SYNTHIA_APPLICATION_ID') ?: 'com.synthia.phone'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('SYNTHIA_VERSION_CODE') ?: '40506')
        versionName System.getenv('SYNTHIA_VERSION_NAME') ?: '0.4.5-birth-candidate.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets { main { jniLibs.srcDirs = ['libnode/bin'] } }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

final String nodeMobileUrl = 'https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip'
final File nodeMobileZip = file("$buildDir/nodejs-mobile-v18.20.4-android.zip")
final File nodeMobileDir = file('libnode')

tasks.register('prepareNodeMobile') {
    outputs.dir(nodeMobileDir)
    doLast {
        if (new File(nodeMobileDir, 'include/node/node.h').isFile() && new File(nodeMobileDir, 'bin/arm64-v8a/libnode.so').isFile()) return
        nodeMobileDir.mkdirs()
        nodeMobileZip.parentFile.mkdirs()
        if (!nodeMobileZip.isFile()) {
            new URL(nodeMobileUrl).withInputStream { input -> nodeMobileZip.withOutputStream { output -> output << input } }
        }
        copy { from zipTree(nodeMobileZip); into nodeMobileDir }
        if (!new File(nodeMobileDir, 'include/node/node.h').isFile()) throw new GradleException('Node Mobile headers missing after build-time download')
        if (!new File(nodeMobileDir, 'bin/arm64-v8a/libnode.so').isFile()) throw new GradleException('Node Mobile arm64 library missing after build-time download')
    }
}

tasks.named('preBuild').configure { dependsOn tasks.named('prepareNodeMobile') }
